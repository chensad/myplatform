# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-robobase"
BBFILE_PATTERN_meta-robobase = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-robobase = "6"

LAYERDEPENDS_meta-robobase = "core"
LAYERSERIES_COMPAT_meta-robobase = "hardknott"
